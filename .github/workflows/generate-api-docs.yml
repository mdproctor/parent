name: Generate API Docs

on:
  workflow_call:
    inputs:
      api-source-dir:
        description: 'Path to API source directory relative to repo root'
        required: false
        default: 'api/src/main/java'
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Download jmarkdoc
        run: |
          mkdir -p .build
          curl -fsSL https://github.com/AdamBien/jMarkDoc/releases/latest/download/jmarkdoc.jar -o .build/jmarkdoc.jar

      - name: Generate API docs
        run: |
          SRC_DIR="${{ inputs.api-source-dir }}"
          OUTPUT_DIR="docs/guides/api"
          if [ ! -d "$SRC_DIR" ]; then
            echo "No API source at $SRC_DIR — skipping"
            exit 0
          fi
          rm -rf "$OUTPUT_DIR"
          java -jar .build/jmarkdoc.jar "$SRC_DIR" "$OUTPUT_DIR"
          COUNT=$(find "$OUTPUT_DIR" -name "*.md" 2>/dev/null | wc -l | tr -d ' ')
          echo "Generated $COUNT API doc files"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/guides/api/
          if git diff --cached --quiet; then
            echo "No API doc changes"
          else
            git commit -m "docs: regenerate API docs from source [skip ci]"
            git push
          fi
